<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — MarketHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-emerald-950 to-slate-900 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl overflow-hidden border border-white/20">
    <!-- Header decorativo -->
    <div class="bg-gradient-to-r from-emerald-800 to-emerald-700 p-8 text-center text-white relative">
      <div class="inline-flex w-16 h-16 rounded-2xl bg-white/10 backdrop-blur-sm items-center justify-center text-3xl shadow-inner mb-3">
        🛒
      </div>
      <h1 class="text-2xl font-bold tracking-tight">MarketHub</h1>
      <p class="text-emerald-200 text-sm mt-1">Sistema de Gestión de Minimercados</p>
    </div>

    <!-- Formulario de Acceso -->
    <div class="p-8">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
          <div class="mb-5 p-3 rounded-xl text-sm font-medium
            {% if category == 'error' %} bg-rose-50 text-rose-700 border border-rose-200
            {% else %} bg-emerald-50 text-emerald-700 border border-emerald-200 {% endif %}">
            {{ message }}
          </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Usuario</label>
          <input type="text" name="usuario" id="usuario" required autofocus
                 class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm transition"
                 placeholder="Ej: admin o cajero">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Contraseña</label>
          <input type="password" name="password" id="password" required
                 class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm transition"
                 placeholder="••••••••">
        </div>

        <button type="submit"
                class="w-full mt-2 py-3.5 px-4 bg-emerald-700 hover:bg-emerald-800 active:scale-[0.99] text-white font-bold rounded-xl shadow-lg shadow-emerald-700/25 transition">
          Ingresar al Sistema
        </button>
      </form>

      <!-- Accesos Rápidos para Pruebas / Demostración -->
      <div class="mt-6 pt-5 border-t border-slate-200">
        <p class="text-xs font-semibold text-slate-500 text-center mb-3">Usuarios de Demostración:</p>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" onclick="cargarCredenciales('admin', 'admin123')"
                  class="px-2 py-1.5 text-xs bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 border border-slate-200 rounded-lg text-slate-700 font-medium transition text-center">
            👑 Admin
          </button>
          <button type="button" onclick="cargarCredenciales('cajero', 'cajero123')"
                  class="px-2 py-1.5 text-xs bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 border border-slate-200 rounded-lg text-slate-700 font-medium transition text-center">
            💳 Cajero
          </button>
          <button type="button" onclick="cargarCredenciales('almacen', 'almacen123')"
                  class="px-2 py-1.5 text-xs bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 border border-slate-200 rounded-lg text-slate-700 font-medium transition text-center">
            📦 Almacén
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function cargarCredenciales(u, p) {
      document.getElementById('usuario').value = u;
      document.getElementById('password').value = p;
    }
  </script>
</body>
</html>
